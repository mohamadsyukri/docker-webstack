# Catch-all for unknown host names, plus the health endpoint compose.yaml checks.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    location / {
        default_type text/plain;
        return 200 "webstack is running, but no site answers to this host name.\nAdd one with: bin/new-site.sh <name> <path-under-projects>\n";
    }
}
