; compose.yaml mounts this folder over the image's php-fpm.d, hiding its docker.conf and
; zz-docker.conf, so their [global] settings live here. FPM runs as www-data, which cannot
; write the default /usr/local/var/log/php-fpm.log (2026-10-23: both PHP containers
; crash-looped on "failed to open error_log ... Permission denied").
[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no
