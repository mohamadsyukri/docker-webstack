; Basic Performance Settings
memory_limit=2048M
max_execution_time=300
max_input_time=300
max_input_vars=3000
request_terminate_timeout=300
output_buffering=1

; File Upload Settings
upload_max_filesize=200M
post_max_size=200M

; OPcache Settings
opcache.enable=1
; 128M was overflowing: opcache reported 8 OOM restarts, and each restart flushes
; the cache and forces a full recompile - the occasional 1.6s outlier on a page.
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
; The three below stay OFF on a dev box:
;   validate_timestamps=0 / revalidate_freq=0 make PHP ignore file changes, so an
;   edit would not take effect until the pool is reloaded;
;   save_comments=0 strips docblocks, which Laravel's attribute/annotation
;   readers need.
;opcache.validate_timestamps=0
;opcache.revalidate_freq=0
;opcache.save_comments=0

; Security & Error Handling
expose_php=0
display_errors=0
log_errors=1

; Session Settings
session.save_handler=files
session.save_path=/tmp/sessions
session.gc_maxlifetime=7200

; Timezone
date.timezone=Asia/Kuala_Lumpur

; Xdebug is installed but idle. XDEBUG_MODE from .env (passed by compose.yaml) overrides this
; when you set it, e.g. XDEBUG_MODE=debug.
xdebug.mode=off
