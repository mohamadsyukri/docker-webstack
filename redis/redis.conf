# Only the settings that differ from redis defaults. The password is passed on the command line
# from .env (REDIS_PASSWORD) — never put it in this file, it is committed.
bind 0.0.0.0
port 6379
dir /data

# Persist to disk so sessions and queued jobs survive a restart.
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

maxmemory-policy noeviction
